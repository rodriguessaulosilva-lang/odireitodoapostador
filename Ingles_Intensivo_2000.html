function ProfileScreen({onSelect}) {
  const [profiles, setProfiles] = useState(() => {
    try { return JSON.parse(localStorage.getItem("eng_profiles_v1")) || {}; } catch { return {}; }
  });
  const [newName, setNewName] = useState("");
  const slots = [1,2,3];
  const save = (p) => { setProfiles(p); localStorage.setItem("eng_profiles_v1", JSON.stringify(p)); };
  const addProfile = () => {
    if (!newName.trim()) return;
    const id = "p" + Date.now();
    const p = {...profiles, [id]: {name: newName.trim(), created: new Date().toLocaleDateString("pt-BR")}};
    save(p); setNewName(""); onSelect(id, newName.trim());
  };
  const ids = Object.keys(profiles);
  return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:20}},
    h("div",{style:{fontSize:52,marginBottom:10}},"🎓"),
    h("div",{style:{fontSize:26,fontWeight:800,color:"#60A5FA",marginBottom:4}},"Inglês Intensivo"),
    h("div",{style:{fontSize:13,color:"#475569",marginBottom:30}}, W.length+" palavras · "+Object.keys(PHRASES).length+" tempos · "+HOMO.length+" homônimos"),
    h("div",{style:{fontSize:16,fontWeight:700,color:"#94A3B8",marginBottom:16}},"Quem está estudando?"),
    h("div",{style:{display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center",marginBottom:20}},
      ids.map(id => h("button",{key:id,onClick:()=>onSelect(id,profiles[id].name),style:{padding:"16px 28px",borderRadius:14,border:"2px solid #3B82F6",background:"#1E293B",color:"#E2E8F0",cursor:"pointer",fontSize:16,fontWeight:700,minWidth:140,transition:"all .15s"}},
        h("div",{style:{fontSize:28,marginBottom:6}},"👤"),
        h("div",null,profiles[id].name),
        h("div",{style:{fontSize:10,color:"#475569",marginTop:4}},"Criado: "+profiles[id].created)
      ))
    ),
    ids.length < 3 && h("div",{style:{display:"flex",gap:8,alignItems:"center",marginTop:8}},
      h("input",{value:newName,onChange:e=>setNewName(e.target.value),onKeyDown:e=>{if(e.key==="Enter")addProfile()},placeholder:"Nome do estudante...",maxLength:20,style:{padding:"10px 16px",borderRadius:10,border:"1px solid #334155",background:"#1E293B",color:"#E2E8F0",fontSize:14,outline:"none",width:200}}),
      h("button",{onClick:addProfile,style:{padding:"10px 20px",borderRadius:10,background:"#3B82F6",border:"none",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700}},"+  Criar perfil")
    ),
    ids.length >= 3 && h("div",{style:{fontSize:11,color:"#475569",marginTop:8}},"Máximo de 3 perfis atingido.")
  );
}

function App() {
  const [profile, setProfile] = useState(null);
  const [profileName, setProfileName] = useState("");
  const [tab, setTab] = useState("vocab");
  const [cat, setCat] = useState("all");
  const [search, setSearch] = useState("");
  const [page, setPage] = useState(1);
  const [notes, setNotes] = useState({});
  const [status, setStatus] = useState({});
  const [custom, setCustom] = useState([]);
  const [progFilter, setProgFilter] = useState("review");
  const [daily, setDaily] = useState({date:"",count:0});
  const [goal, setGoal] = useState(10);
  const [convTheme, setConvTheme] = useState(null);
  const [copied, setCopied] = useState(false);
  const [slangSearch, setSlangSearch] = useState("");
  const [newEn, setNewEn] = useState("");
  const [newPt, setNewPt] = useState("");
  const [newEx, setNewEx] = useState("");
  const [newCatW, setNewCatW] = useState("custom");
  const [editing, setEditing] = useState(null);
  const [noteInput, setNoteInput] = useState("");
  const [tense, setTense] = useState("Simple Present");
  const [homoSearch, setHomoSearch] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [quizMode, setQuizMode] = useState("flash");
  const [quizCat, setQuizCat] = useState("all");
  const [quizDir, setQuizDir] = useState("en2pt");
  const [deck, setDeck] = useState([]);
  const [deckIdx, setDeckIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizDone, setQuizDone] = useState(false);
  const [flashStats, setFlashStats] = useState({know:0,dontknow:0,wrongIds:[]});
  const [mcOptions, setMcOptions] = useState([]);
  const [mcPicked, setMcPicked] = useState(null);
  const [mcStats, setMcStats] = useState({correct:0,wrong:0,wrongIds:[]});

  useEffect(() => {
    if (!profile) return;
    try { const s = localStorage.getItem("eng_notes_"+profile); if(s) setNotes(JSON.parse(s)); else setNotes({}); } catch { setNotes({}); }
    try { const c = localStorage.getItem("eng_custom_"+profile); if(c) setCustom(JSON.parse(c)); else setCustom([]); } catch { setCustom([]); }
    try { const d = localStorage.getItem("eng_daily_"+profile); if(d){ const dd=JSON.parse(d); setDaily(dd.date===todayStr()?dd:{date:todayStr(),count:0}); } else setDaily({date:todayStr(),count:0}); } catch { setDaily({date:todayStr(),count:0}); }
    try { const g = localStorage.getItem("eng_goal_"+profile); if(g) setGoal(parseInt(g)||10); else setGoal(10); } catch { setGoal(10); }
    setConvTheme(null);
    try {
      const st = localStorage.getItem("eng_status_"+profile);
      if(st){ setStatus(JSON.parse(st)); }
      else {
        // migração: converte o formato antigo "eng_learned_" em status "learned"
        const l = localStorage.getItem("eng_learned_"+profile);
        if(l){ const old=JSON.parse(l); const mig={}; Object.keys(old).forEach(function(k){mig[k]="learned";}); setStatus(mig); localStorage.setItem("eng_status_"+profile, JSON.stringify(mig)); }
        else setStatus({});
      }
    } catch { setStatus({}); }
  }, [profile]);

  const allW = W.concat(SLANG).concat(custom);
  const wordById = (id) => allW.find(function(w){return w[0]==id;});

  const saveNotes = (n) => { setNotes(n); if(profile) localStorage.setItem("eng_notes_"+profile, JSON.stringify(n)); };
  const openNote = (id) => { setEditing(id); setNoteInput(notes[id] || ""); };
  const submitNote = () => { const n={...notes}; if(noteInput.trim()) n[editing]=noteInput.trim(); else delete n[editing]; saveNotes(n); setEditing(null); };
  const saveStatus = (s) => { setStatus(s); if(profile) localStorage.setItem("eng_status_"+profile, JSON.stringify(s)); };
  const setWordStatus = (id, st) => { const s={...status}; if(st==="new"||!st) delete s[id]; else s[id]=st; saveStatus(s); };
  const saveCustom = (c) => { setCustom(c); if(profile) localStorage.setItem("eng_custom_"+profile, JSON.stringify(c)); };
  const addCustom = () => {
    if(!newEn.trim()||!newPt.trim()) return;
    var id = "u"+Date.now();
    var w = [id, newEn.trim(), newPt.trim(), newEx.trim()||"—", newCatW||"custom", ""];
    saveCustom(custom.concat([w]));
    // já envia a palavra nova para a revisão (fixação)
    setWordStatus(id, "review");
    setNewEn(""); setNewPt(""); setNewEx("");
  };
  const removeCustom = (id) => { saveCustom(custom.filter(function(w){return w[0]!==id;})); const s={...status}; delete s[id]; saveStatus(s); };
  const saveGoal = (g) => { var v=Math.max(1,Math.min(200,g||1)); setGoal(v); if(profile) localStorage.setItem("eng_goal_"+profile, String(v)); };
  const bumpDaily = () => {
    var t=todayStr();
    var d = (daily.date===t) ? {date:t,count:daily.count+1} : {date:t,count:1};
    setDaily(d); if(profile) localStorage.setItem("eng_daily_"+profile, JSON.stringify(d));
  };
  const logout = () => { setProfile(null); setProfileName(""); setNotes({}); setStatus({}); setCustom([]); setConvTheme(null); };

  const newRound = (ids) => {
    var pool;
    if (ids && ids.length) pool = allW.filter(function(w){return ids.indexOf(w[0])>=0;});
    else if (quizMode==="review") pool = allW.filter(function(w){return status[w[0]]==="review" && (quizCat==="all"||w[4]===quizCat);});
    else pool = allW.filter(function(w){return quizCat==="all"||w[4]===quizCat;});
    var lim = ids ? pool.length : Math.min(pool.length, ROUND_SIZE);
    setDeck(shuffle(pool).slice(0, lim));
    setDeckIdx(0); setFlipped(false); setQuizDone(false); setMcPicked(null);
    setFlashStats({know:0,dontknow:0,wrongIds:[]});
    setMcStats({correct:0,wrong:0,wrongIds:[]});
  };
  const advance = () => {
    if (deckIdx+1 >= deck.length) { setQuizDone(true); }
    else { setDeckIdx(deckIdx+1); setFlipped(false); setMcPicked(null); }
  };
  const flashAnswer = (know) => {
    var cur = deck[deckIdx]; if(!cur) return;
    setFlashStats(function(s){return {know:s.know+(know?1:0), dontknow:s.dontknow+(know?0:1), wrongIds: know?s.wrongIds:s.wrongIds.concat([cur[0]])};});
    bumpDaily();
    advance();
  };
  const mcAnswer = (opt) => {
    var cur = deck[deckIdx]; if(!cur || mcPicked!==null) return;
    setMcPicked(opt);
    bumpDaily();
    var ok = opt === cur[quizDir==="en2pt"?2:1];
    setMcStats(function(s){return {correct:s.correct+(ok?1:0), wrong:s.wrong+(ok?0:1), wrongIds: ok?s.wrongIds:s.wrongIds.concat([cur[0]])};});
  };

  useEffect(function(){ if(tab==="quiz") newRound(); /* eslint-disable-line */ }, [tab, quizMode, quizCat, quizDir]);
  useEffect(function(){
    if(tab!=="quiz" || quizMode!=="test") return;
    var cur = deck[deckIdx];
    if(!cur){ setMcOptions([]); return; }
    var ansIdx = quizDir==="en2pt"?2:1;
    var correct = cur[ansIdx];
    var others = shuffle(W.filter(function(w){return w[0]!==cur[0];})).slice(0,6)
      .map(function(w){return w[ansIdx];})
      .filter(function(o){return o!==correct;});
    var uniq = [];
    others.forEach(function(o){ if(uniq.indexOf(o)<0) uniq.push(o); });
    while(uniq.length<3){ var rw = W[Math.floor(Math.random()*W.length)][ansIdx]; if(rw!==correct && uniq.indexOf(rw)<0) uniq.push(rw); }
    setMcOptions(shuffle(uniq.slice(0,3).concat([correct])));
    setMcPicked(null);
  }, [deckIdx, deck, quizMode, quizDir, tab]);

  if (!profile) return h(ProfileScreen, {onSelect: (id, name) => { setProfile(id); setProfileName(name); }});

  const filtered = allW.filter(w => (cat==="all"||w[4]===cat) && (!search||w[1].toLowerCase().includes(search.toLowerCase())||w[2].toLowerCase().includes(search.toLowerCase())));
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const pageWords = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);
  const catColor = (id) => (CATS.find(c=>c.id===id)||{}).color||"#6B7280";
  const catLabel = (id) => { const c=CATS.find(c=>c.id===id); return c?c.label.split(" ").slice(1).join(" "):id; };
  const filteredHomo = HOMO.filter(h=>!homoSearch||h.w.toLowerCase().includes(homoSearch.toLowerCase()));
  const notedWords = allW.filter(w=>notes[w[0]]);
  const learnedWords = allW.filter(w=>status[w[0]]==="learned");
  const reviewWords = allW.filter(w=>status[w[0]]==="review");
  const learnedCount = learnedWords.length;
  const reviewCount = reviewWords.length;
  const bucketNewCount = allW.length - learnedCount - reviewCount;
  const slangWords = SLANG.filter(w=>!slangSearch||w[1].toLowerCase().includes(slangSearch.toLowerCase())||w[2].toLowerCase().includes(slangSearch.toLowerCase()));
  // buckets estilo Memrise
  const bucketWords = progFilter==="learned" ? learnedWords
    : progFilter==="review" ? reviewWords
    : allW.filter(w=>!status[w[0]]);
  const tenses = Object.keys(PHRASES);
  const statusSel = (id) => { var st=status[id]||"new"; return h("select",{value:st,onChange:function(e){setWordStatus(id,e.target.value)},title:"⬜ Nova · 🔖 Fixar (enviar p/ flashcards) · 🎓 Aprendi",style:{padding:"3px 4px",borderRadius:5,border:"1px solid "+(st==="learned"?"#166534":st==="review"?"#854D0E":"#334155"),background:"#1E293B",color:st==="learned"?"#4ADE80":st==="review"?"#FACC15":"#94A3B8",fontSize:10,fontWeight:600,cursor:"pointer",outline:"none"}},
    h("option",{value:"new"},"⬜ Nova"),
    h("option",{value:"review"},"🔖 Fixar"),
    h("option",{value:"learned"},"🎓 Aprendi")
  ); };
  const todayCount = (daily.date===todayStr()) ? daily.count : 0;
  const goalPct = Math.min(100, Math.round((todayCount/Math.max(1,goal))*100));
  const dailyBar = () => h("div",{style:{background:"#1E293B",borderRadius:12,padding:"12px 14px",marginBottom:14,border:"1px solid "+(todayCount>=goal?"#166534":"#1E3A5F")}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}},
      h("div",{style:{fontSize:12,fontWeight:700,color:todayCount>=goal?"#4ADE80":"#60A5FA"}}, todayCount>=goal?"🎉 Meta diária concluída!":"🎯 Meta diária de revisão"),
      h("div",{style:{display:"flex",alignItems:"center",gap:6}},
        h("span",{style:{fontSize:12,color:"#94A3B8"}}, todayCount+" / "+goal+" hoje"),
        h("button",{onClick:function(){saveGoal(goal-5)},style:{padding:"1px 8px",borderRadius:6,background:"#0F172A",border:"1px solid #334155",color:"#94A3B8",cursor:"pointer",fontSize:13,fontWeight:700}},"−"),
        h("button",{onClick:function(){saveGoal(goal+5)},style:{padding:"1px 8px",borderRadius:6,background:"#0F172A",border:"1px solid #334155",color:"#94A3B8",cursor:"pointer",fontSize:13,fontWeight:700}},"+")
      )
    ),
    h("div",{style:{height:8,background:"#0F172A",borderRadius:5,overflow:"hidden"}},
      h("div",{style:{height:"100%",width:goalPct+"%",background:todayCount>=goal?"linear-gradient(90deg,#22C55E,#4ADE80)":"linear-gradient(90deg,#3B82F6,#60A5FA)",transition:"width .3s"}})
    )
  );
  const buildConversation = () => {
    if(reviewWords.length===0){ setConvTheme(null); return; }
    var picked = shuffle(reviewWords).slice(0, Math.min(12, reviewWords.length));
    var counts={}; picked.forEach(function(w){counts[w[4]]=(counts[w[4]]||0)+1;});
    var mainCat=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0];
    var theme = THEME_MAP[mainCat] || "Uma conversa do dia a dia";
    var wl = picked.map(function(w){return w[1]+" ("+w[2]+")";});
    var prompt = "Let's practice English conversation. I'm a Brazilian learner practicing new vocabulary.\n\n"
      + "Topic: "+theme+".\n\n"
      + "Please have a natural, simple conversation with me about this topic. Try to use the words below, one or two at a time. After each of my replies, gently correct my mistakes and ask me a follow-up question to keep the conversation going.\n\n"
      + "Words I'm learning:\n"+wl.join(", ")+"\n\n"
      + "Start by greeting me and asking the first question.";
    setConvTheme({theme:theme, words:picked, prompt:prompt});
    setCopied(false);
  };
  const copyPrompt = () => {
    if(!convTheme) return;
    try { navigator.clipboard.writeText(convTheme.prompt).then(function(){setCopied(true);setTimeout(function(){setCopied(false)},2000);}); }
    catch(e){ try{ var ta=document.createElement("textarea");ta.value=convTheme.prompt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);setCopied(true);setTimeout(function(){setCopied(false)},2000);}catch(e2){} }
  };
  const btn = (cond) => ({padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:cond?"#3B82F6":"#1E293B",color:cond?"#fff":"#94A3B8"});
  const qFrontIdx = quizDir==="en2pt"?1:2;
  const qBackIdx = quizDir==="en2pt"?2:1;
  const qCur = deck[deckIdx];

  return h("div",{style:{fontFamily:"'Segoe UI',system-ui,sans-serif",background:"#0F172A",minHeight:"100vh",color:"#E2E8F0"}},
    // HEADER
    h("div",{style:{background:"linear-gradient(135deg,#1a3a6b 0%,#0F172A 100%)",padding:"10px 16px",borderBottom:"1px solid #1E3A5F",position:"sticky",top:0,zIndex:10}},
      h("div",{style:{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}},
        h("div",null,
          h("div",{style:{fontWeight:800,fontSize:18,color:"#60A5FA"}},"🎓 Inglês Intensivo"),

          [["vocab","📚 Vocab"],["phrases","💬 Verbos"],["homo","🔄 Homônimos"],["slang","🗣️ Gírias"],["quiz","🃏 Quiz"],["progress","📊 Progresso"],["mynotes","📝 Notas"]].map(function(t){return h("button",{key:t[0],onClick:function(){setTab(t[0])},style:btn(tab===t[0])},t[1])}),
          h("button",{onClick:logout,style:{padding:"5px 10px",borderRadius:8,background:"#7F1D1D",border:"none",color:"#FCA5A5",cursor:"pointer",fontSize:10,marginLeft:4}},"Sair")
        )
      )
    ),
    h("div",{style:{maxWidth:1200,margin:"0 auto",padding:"12px 10px"}},

      // VOCAB TAB

            ? h("div",{style:{fontSize:11,color:"#64748B"}},"Marque palavras como 🔖 Fixar para gerar um tema de conversa com base no que você está aprendendo.")
            : !convTheme
              ? h("div",{style:{fontSize:11,color:"#64748B"}},"Gere um tema e um roteiro pronto (em inglês) usando as suas "+reviewCount+" palavras 'Para fixação', para colar no Gemini ou Grok.")
              : h("div",null,
                  h("div",{style:{fontSize:14,fontWeight:700,color:"#E2E8F0",marginBottom:6}},"📌 "+convTheme.theme),
                  h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}},
                    convTheme.words.map(function(w,i){return h("span",{key:i,style:{fontSize:10,background:"#0F172A",border:"1px solid #334155",borderRadius:12,padding:"2px 8px",color:"#94A3B8"}}, w[1]);})
                  ),
                  h("div",{style:{fontSize:10,color:"#64748B",marginBottom:4}},"Prompt pronto para colar no Gemini / Grok:"),
                  h("textarea",{readOnly:true,value:convTheme.prompt,onFocus:function(e){e.target.select()},style:{width:"100%",minHeight:130,padding:"10px",borderRadius:8,border:"1px solid #334155",background:"#0a1120",color:"#CBD5E1",fontSize:11,fontFamily:"monospace",lineHeight:1.5,resize:"vertical",outline:"none",boxSizing:"border-box"}}),
                  h("button",{onClick:copyPrompt,style:{marginTop:8,padding:"8px 16px",borderRadius:8,background:copied?"#166534":"#3B82F6",border:"none",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:700}}, copied?"✓ Copiado!":"📋 Copiar prompt")
                )
        ),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}},
          [["new","⬜ Não aprendidas",bucketNewCount,"#94A3B8"],["review","🔖 Para fixação",reviewCount,"#FACC15"],["learned","🎓 Aprendidas",learnedCount,"#4ADE80"]].map(function(b){
            var active=progFilter===b[0];
            return h("button",{key:b[0],onClick:function(){setProgFilter(b[0])},style:{padding:"14px 10px",borderRadius:12,border:"2px solid "+(active?b[3]:"#1E3A5F"),background:active?b[3]+"1a":"#1E293B",cursor:"pointer",textAlign:"left"}},
              h("div",{style:{fontSize:24,fontWeight:800,color:b[3]}}, b[2]),
              h("div",{style:{fontSize:11,color:active?b[3]:"#64748B",fontWeight:600,marginTop:2}}, b[1])
            );
          })
        ),
        // adicionar palavra própria
        h("div",{style:{background:"#1E293B",borderRadius:12,padding:"12px 14px",marginBottom:14,border:"1px solid #1E3A5F"}},
          h("div",{style:{fontSize:12,fontWeight:700,color:"#2DD4BF",marginBottom:8}},"⭐ Adicionar palavra que aprendi por outros meios"),
          h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
            h("input",{value:newEn,onChange:function(e){setNewEn(e.target.value)},placeholder:"Inglês *",style:{flex:"1 1 120px",padding:"8px 10px",borderRadius:8,border:"1px solid #334155",background:"#0F172A",color:"#E2E8F0",fontSize:12,outline:"none"}}),
            h("input",{value:newPt,onChange:function(e){setNewPt(e.target.value)},placeholder:"Português *",style:{flex:"1 1 120px",padding:"8px 10px",borderRadius:8,border:"1px solid #334155",background:"#0F172A",color:"#E2E8F0",fontSize:12,outline:"none"}}),
            h("input",{value:newEx,onChange:function(e){setNewEx(e.target.value)},placeholder:"Exemplo (opcional)",style:{flex:"1 1 160px",padding:"8px 10px",borderRadius:8,border:"1px solid #334155",background:"#0F172A",color:"#E2E8F0",fontSize:12,outline:"none"}}),
            h("select",{value:newCatW,onChange:function(e){setNewCatW(e.target.value)},style:{padding:"8px 10px",borderRadius:8,border:"1px solid #334155",background:"#0F172A",color:"#94A3B8",fontSize:12,cursor:"pointer",outline:"none"}},
              CATS.filter(function(c){return c.id!=="all";}).map(function(c){return h("option",{key:c.id,value:c.id},c.label)})
            ),
            h("button",{onClick:addCustom,style:{padding:"8px 16px",borderRadius:8,background:"#14B8A6",border:"none",color:"#022c22",cursor:"pointer",fontSize:12,fontWeight:800}},"+ Adicionar")
          ),
          h("div",{style:{fontSize:10,color:"#475569",marginTop:6}},"A palavra entra automaticamente em 🔖 Para fixação (aparece nos flashcards de revisão).")
        ),
        h("div",{style:{display:"flex",gap:8,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",marginBottom:10}},
          h("div",{style:{fontSize:12,color:"#64748B"}}, "Mostrando: ",h("strong",{style:{color:"#E2E8F0"}}, progFilter==="new"?"Não aprendidas":progFilter==="review"?"Para fixação":"Aprendidas")," ("+bucketWords.length+")"),
          progFilter==="review" && reviewCount>0 && h("button",{onClick:function(){setQuizMode("review");setQuizCat("all");setTab("quiz");},style:{padding:"8px 14px",borderRadius:10,background:"#EAB3081a",border:"1px solid #854D0E",color:"#FACC15",cursor:"pointer",fontSize:12,fontWeight:700}},"🃏 Revisar em flashcards")
        ),
        bucketWords.length===0
          ? h("div",{style:{textAlign:"center",padding:"40px 20px",color:"#334155",fontSize:13}}, progFilter==="review"?"Nenhuma palavra para fixação. Marque palavras como 🔖 Fixar.":progFilter==="learned"?"Nenhuma palavra aprendida ainda.":"Tudo classificado! 🎉")
          : h("div",{style:{overflowX:"auto"}},
              h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
                h("thead",null,h("tr",{style:{background:"#1E293B"}},
                  ["🇬🇧","🇧🇷","Exemplo","Cat.","Status",""].map(function(hd){return h("th",{key:hd,style:{padding:"7px 6px",textAlign:"left",borderBottom:"1px solid #334155",color:"#60A5FA",fontSize:11}},hd)})
                )),
                h("tbody",null,bucketWords.slice(0,150).map(function(w,i){
                  var id=w[0],c=w[4],isCustom=(""+id).charAt(0)==="u";
                  return h("tr",{key:id,style:{background:i%2===0?"#0F172A":"#0d1525",borderBottom:"1px solid #1a2540"}},
                    h("td",{style:{padding:"6px",fontWeight:700,color:"#E2E8F0",whiteSpace:"nowrap"}}, w[1], isCustom&&h("span",{style:{marginLeft:5,fontSize:9,color:"#2DD4BF"}},"⭐")),
                    h("td",{style:{padding:"6px",color:"#94A3B8",fontSize:11}},w[2]),
                    h("td",{style:{padding:"6px",color:"#475569",fontStyle:"italic",fontSize:10,maxWidth:180}},w[3]),
                    h("td",{style:{padding:"6px"}},h("span",{style:{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,background:catColor(c)+"1a",color:catColor(c),whiteSpace:"nowrap"}},catLabel(c))),
                    h("td",{style:{padding:"6px"}}, statusSel(id)),
                    h("td",{style:{padding:"6px"}}, isCustom && h("button",{onClick:function(){removeCustom(id)},title:"Excluir palavra própria",style:{padding:"2px 7px",borderRadius:5,background:"#3b0e0e",border:"none",color:"#F87171",cursor:"pointer",fontSize:10}},"🗑️"))
                  )
                }))
              ),
              bucketWords.length>150 && h("div",{style:{textAlign:"center",fontSize:11,color:"#475569",marginTop:8}}, "Mostrando 150 de "+bucketWords.length+". Use os flashcards ou filtros para estudar o restante.")
            )
      ),

      // NOTES TAB
      tab==="mynotes" && h("div",null,
        notedWords.length===0?
          h("div",{style:{textAlign:"center",padding:"50px 20px",color:"#334155"}},
            h("div",{style:{fontSize:48,marginBottom:10}},"📝"),
            h("p",{style:{fontSize:14,color:"#475569"}},"Nenhuma anotação de "+profileName+"."),
            h("p",{style:{fontSize:12,color:"#334155"}},"Na aba Vocab, clique 📝 em qualquer palavra.")
          ):
          h("div",null,
            h("div",{style:{fontSize:12,color:"#64748B",marginBottom:12}},
              h("strong",{style:{color:"#60A5FA"}},notedWords.length)," anotações de ",h("strong",{style:{color:"#F59E0B"}},profileName)
            ),
            h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:12}},
              h("thead",null,h("tr",{style:{background:"#1E293B"}},
                ["#","🇬🇧","🇧🇷","📝 Anotação",""].map(function(hd){return h("th",{key:hd,style:{padding:"7px 6px",textAlign:"left",borderBottom:"1px solid #334155",color:"#60A5FA",fontSize:11}},hd)})
              )),
              h("tbody",null,notedWords.map(function(w,i){
                var id=w[0],en=w[1],pt=w[2];
                return h("tr",{key:id,style:{background:i%2===0?"#0F172A":"#0d1525",borderBottom:"1px solid #1a2540"}},
                  h("td",{style:{padding:"6px",color:"#334155",fontSize:10}},id),
                  h("td",{style:{padding:"6px",fontWeight:700,color:"#E2E8F0"}},en),
                  h("td",{style:{padding:"6px",color:"#94A3B8",fontSize:11}},pt),
                  h("td",{style:{padding:"6px",color:"#F59E0B",fontStyle:"italic",fontSize:11}},notes[id]),
                  h("td",{style:{padding:"6px"}},
                    h("button",{onClick:function(){var n=Object.assign({},notes);delete n[id];saveNotes(n)},style:{padding:"2px 7px",borderRadius:5,background:"#3b0e0e",border:"none",color:"#F87171",cursor:"pointer",fontSize:10}},"🗑️")
                  )
                )
              }))
            )
          )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
